# small-calc: a research agent on Modal runs a real quantum-chemistry calculation relevant to the group (ion–water
# binding vs the charge-scaled (ECC) point-charge picture) and writes it up the way a scientist would: a lab notebook
# (NOTES_TO_SELF.md, which evolve learns from) and a manuscript drafted early and revised as numbers arrive
# (results/manuscript.md with LaTeX math, a figure and [n] citations of group papers). The check verifies the numbers
# in result.json, the manuscript, the notebook and that the manuscript was written and revised through Write/Edit.
#   agent-runner flow run tasks/flows/small-calc.yaml --var ion=Ca2+
name: small-calc
workdir: ../..
environment: "{{ vars.environment }}"
concurrency: 2
vars:
  ion: Na+
  environment: modal
  python: python3
  task_id: small-calc
  task_title: Ion–water binding
  lessons: ""                           # filled by the server from evolve (lessons learned from earlier runs' traces)
  tools_dir: ""                         # filled by the server: scripts from earlier passing runs (→ /app/small-calc)
  calc_image: ""                        # filled by the server once the calc-image capability is installed: a registry
                                        # image with PySCF preinstalled (tasks/capabilities/calc-image); "" = default
steps:
  - id: prepare
    description: Set up the calculation folder, the research protocol and the group papers to cite
    run: '"{{ vars.python }}" -m tasks.prepare_calc'
    env: {TASK_ION: "{{ vars.ion }}"}
    outputs: auto                       # JSON on success; on failure the error shows the script's stderr
    timeout: 600

  - id: calc
    description: A research agent on Modal runs the calculation and writes the manuscript
    paths: ["{{ prepare.output.dir }}", "{{ vars.tools_dir }}"]   # an empty tools_dir is dropped
    image: "{{ vars.calc_image }}"      # "" → AGENT_RUNNER_MODAL_IMAGE or the engine's default
    timeout: 2400
    instruction: >
      You are the research agent of Pavel Jungwirth's group (IOCB Prague). The group models ions in water and
      corrects force fields for missing electronic polarization by scaling ionic charges by 0.75 (electronic
      continuum correction, ECC). Research question: how strongly does {{ prepare.output.ion }} (charge
      +{{ prepare.output.charge }}, element {{ prepare.output.element }}) bind a single water molecule at the DFT
      level, and how do full and ECC-scaled point charges compare with that? Work in /app/calc: task.json has the
      parameters, PROTOCOL.md the research protocol and the group papers you may cite (also in references.json and
      context.md).

      1. Open your lab notebook (calc/NOTES_TO_SELF.md) and get the environment: the calculation needs PySCF,
      numpy and matplotlib in /opt/calc. Check first; only if they are missing, install them:
      python3 -m venv /opt/calc && /opt/calc/bin/pip install -q pyscf numpy matplotlib (if PySCF can't be
      installed, use xtb or tblite instead and say so in result.json "software").

      2. Write calc/run_calc.py and start it in the background with /opt/calc/bin/python, saving everything it
      prints to calc/output.log. It must: build one water molecule (O–H 0.9572 Å, H–O–H 104.52°) and put the ion
      on the water's C2 axis on the oxygen side (ion facing O, as in the first hydration shell); scan the ion–O
      distance from 1.7 to 3.3 Å in 0.1 Å steps with B3LYP/def2-SVP (interaction energy = E(complex) − E(ion) −
      E(water), in kcal/mol, negative = bound); at the scan minimum compute the counterpoise-corrected interaction
      energy with B3LYP/def2-TZVP (ghost atoms); compute the point-charge Coulomb energy between the ion and SPC/E
      water charges (O −0.8476 e, H +0.4238 e) at every scan distance and at the minimum, once with the full ion
      charge and once with the ion charge scaled by 0.75 (ECC); save Figure 1 as calc/results/fig1.png; time the
      whole run.

      3. While it runs, draft calc/results/manuscript.md with the Write tool: title, abstract and results with
      **TBD** for the numbers, methods with the equations (the interaction and counterpoise energies, the Coulomb
      sum, the ECC charge $q_\mathrm{eff} = q/\sqrt{\varepsilon_\mathrm{el}}$ with $\varepsilon_\mathrm{el}
      \approx 1.78$), the planned Figure 1, and the references.

      4. When it finishes, write calc/result.json with numbers (not strings): {"ion", "charge", "software" (with
      version), "method", "basis_scan", "basis_final", "r_min_angstrom", "e_int_kcal_mol" (counterpoise-corrected,
      def2-TZVP), "e_int_uncorrected_kcal_mol", "bsse_kcal_mol", "scan": [{"r_angstrom", "e_int_kcal_mol"}, ...],
      "e_coulomb_full_charge_kcal_mol", "e_coulomb_ecc_kcal_mol", "ecc_scaling": 0.75, "figures":
      ["results/fig1.png"], "wall_time_s"}. Every number must come from the run, never typed in.

      5. Revise the manuscript with Edit as the numbers come in: replace each **TBD**, correct any draft statement
      the data contradicts (for example a def2-SVP number that counterpoise correction changes), and complete the
      discussion: what the full- vs scaled-charge comparison suggests about why the group scales ionic charges, why
      a gas-phase ion–single-water comparison is only a rough illustration of it, and the limitations (gas phase,
      one water, DFT functional, no dispersion). Then finish the notebook: what was slow (seconds) and what the
      next run should do differently.

      {{ prepare.output.protocol }}

      Cite group papers from references.json as [n] for every statement about the literature or the group's work;
      numbers from this run need no citation. Use only numbers that exist in references.json.

      {{ vars.lessons }}
    check: >-
      python3 "{{ prepare.output.checker }}" calc . --references "{{ prepare.output.references_file }}"
      --ion "{{ prepare.output.ion }}" --research
    retry: {max: 1, until: "(reward or 0) >= 1"}   # reward is None when the trial errored

  - id: collect
    description: Copy the results, manuscript, figures and notes to the run's result folder and summarize them
    needs: [calc]
    run: >-
      "{{ vars.python }}" -m tasks.collect --step calc --files result.json results/manuscript.md 'results/fig*.png'
      NOTES_TO_SELF.md run_calc.py output.log
    outputs: auto
